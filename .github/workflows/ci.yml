name: CI

# Rete di sicurezza minima: build + typecheck su ogni push e PR. Non prende
# bug di logica, ma prende quelli che root out un merge alla cieca (import
# rotti, tipi disallineati, sintassi) — è già mancata più volte quando
# sessioni diverse hanno toccato lo stesso file senza vedersi.

on:
  push:
    branches-ignore: []
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
