name: Gazzetta — genera copertine

# Quando Hermes committa un nuovo articolo (.md con blocco `cover:` nel frontmatter),
# questa Action genera l'immagine di copertina mancante e la committa.
# Il push dell'immagine è fatto con GITHUB_TOKEN, che NON ri-innesca le Action:
# nessun loop.

on:
  push:
    branches: [main]
    paths:
      - 'public/articoli/md/**.md'
  workflow_dispatch:   # avvio manuale dalla tab Actions (rigenera una copertina senza toccare l'articolo)
    inputs:
      slug:
        description: "slug dell'articolo, es. gazzetta-g7"
        required: false
      seed:
        description: "seed alternativo per una variante"
        required: false
      force:
        description: "sovrascrivi la copertina esistente"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  cover:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Ensure Chromium for Puppeteer
        run: npx puppeteer browsers install chrome

      - name: Genera copertine mancanti
        id: build
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          IMAGE_SEED: ${{ github.event.inputs.seed }}
        run: |
          ARGS="--all"
          if [[ -n "${{ github.event.inputs.slug }}" ]]; then
            ARGS="public/articoli/md/${{ github.event.inputs.slug }}.md"
          fi
          if [[ "${{ github.event.inputs.force }}" == "true" ]]; then
            ARGS="$ARGS --force"
          fi
          node scripts/gazzetta/build_cover_from_md.js $ARGS

      - name: Commit immagini generate
        run: |
          if [[ -n "$(git status --porcelain public/image/gazzetta)" ]]; then
            git config user.name "gazzetta-bot"
            git config user.email "actions@users.noreply.github.com"
            git add public/image/gazzetta
            git commit -m "Gazzetta: copertine generate automaticamente"
            git push
          else
            echo "Nessuna nuova copertina da committare."
          fi
